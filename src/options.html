<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orgscope — Options</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="page">
    <div class="page-hd">
      <div class="grow">
        <h1>Orgscope</h1>
        <p class="sub" id="version">—</p>
      </div>
      <span class="saved" id="saved" data-i18n="options.saved">Saved</span>
    </div>

    <div class="block">
      <h2 data-i18n="options.language">Language</h2>
      <select id="language"></select>
      <p class="hint" data-i18n="options.languageHint"></p>
    </div>

    <div class="block">
      <h2 data-i18n="options.shortcuts">Panel shortcuts</h2>
      <div class="rows" id="rows"></div>

      <div class="add-row">
        <select id="catalog"></select>
        <button class="btn" id="addCatalog" data-i18n="options.add">Add</button>
        <button class="btn" id="addCustom" data-i18n="options.addCustom">Add custom</button>
        <button class="btn danger" id="reset" data-i18n="options.reset">Restore defaults</button>
      </div>

      <p class="hint" data-i18n="options.hint"></p>
    </div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
