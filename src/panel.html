<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stara SF Toolbox</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="hd">
    <div class="hd-org">
      <span class="hd-title" id="orgName">Stara SF Toolbox</span>
      <span class="hd-host" id="orgHost">connecting…</span>
    </div>
    <div class="hd-actions">
      <span class="env" id="envBadge" hidden></span>
      <button class="icon-btn" id="optionsBtn" title="Options">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="2.2"/>
          <path d="M8 1.6v1.7M8 12.7v1.7M14.4 8h-1.7M3.3 8H1.6M12.5 3.5l-1.2 1.2M4.7 11.3l-1.2 1.2M12.5 12.5l-1.2-1.2M4.7 4.7 3.5 3.5"/>
        </svg>
      </button>
      <button class="icon-btn" id="refreshAll" title="Refresh everything">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.9"/><path d="M13.8 2.6v2.6h-2.6"/>
        </svg>
      </button>
      <button class="icon-btn" id="closeBtn" title="Close panel">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M4 4l8 8M12 4l-8 8"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="banner update" id="updateBanner" hidden></div>
  <div class="banner" id="banner" hidden></div>

  <main class="body">
    <!-- deployments ---------------------------------------------------- -->
    <section class="sec">
      <h2 class="sec-h">
        <span>Deployment status</span>
        <span class="sec-tools">
          <a class="sec-link" href="#" data-setup="/lightning/setup/DeployStatus/home">Setup</a>
          <button class="mini-btn" id="refreshDeploy" title="Refresh deployment status">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.9"/><path d="M13.8 2.6v2.6h-2.6"/>
            </svg>
          </button>
        </span>
      </h2>
      <div id="deploy" class="deploy"><div class="skeleton"></div></div>
    </section>

    <!-- apex jobs ------------------------------------------------------ -->
    <section class="sec">
      <h2 class="sec-h">
        <span>Apex jobs</span>
        <span class="sec-tools">
          <button class="mini-btn" id="refreshJobs" title="Refresh Apex jobs">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.9"/><path d="M13.8 2.6v2.6h-2.6"/>
            </svg>
          </button>
        </span>
      </h2>
      <div class="kpis" id="kpis">
        <button class="kpi" data-setup="/lightning/setup/ScheduledJobs/home" data-kpi="scheduled">
          <span class="kpi-n">–</span><span class="kpi-l">Scheduled</span>
        </button>
        <button class="kpi" data-setup="/lightning/setup/AsyncApexJobs/home" data-kpi="running">
          <span class="kpi-n">–</span><span class="kpi-l">Running</span>
        </button>
        <button class="kpi" data-setup="/lightning/setup/ApexFlexQueue/home" data-kpi="flex">
          <span class="kpi-n">–</span><span class="kpi-l">Flex queue</span>
        </button>
      </div>
      <p class="kpi-err" id="kpiErr" hidden></p>
      <div id="runningJobs"></div>
      <div id="failedJobs"></div>
      <div id="scheduledJobs"></div>
    </section>

    <!-- org limits ----------------------------------------------------- -->
    <section class="sec">
      <h2 class="sec-h">
        <span>Org limits</span>
        <span class="sec-tools">
          <button class="mini-btn" id="refreshOrg" title="Refresh limits and coverage">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.9"/><path d="M13.8 2.6v2.6h-2.6"/>
            </svg>
          </button>
        </span>
      </h2>
      <div id="limits"><div class="skeleton" style="height:120px"></div></div>
      <div id="coverage"></div>
    </section>

    <!-- debug logs ----------------------------------------------------- -->
    <section class="sec">
      <h2 class="sec-h">
        <span>Debug logs</span>
        <span class="sec-tools">
          <a class="sec-link" href="#" data-setup="/lightning/setup/ApexDebugLogs/home">Setup</a>
        </span>
      </h2>
      <div id="logs"></div>
    </section>

    <!-- shortcuts ------------------------------------------------------ -->
    <section class="sec">
      <h2 class="sec-h">
        <span>Shortcuts</span>
        <span class="sec-tools">
          <button class="mini-btn" id="editShortcuts" title="Edit shortcuts">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
              <path d="M11.2 2.4 13.6 4.8 5.6 12.8 2.4 13.6l.8-3.2z"/>
            </svg>
          </button>
        </span>
      </h2>

      <div class="jump">
        <input id="jumpInput" type="text" spellcheck="false" autocomplete="off"
               placeholder="Paste a record Id to open it…" maxlength="18">
        <span class="jump-hint" id="jumpHint"></span>
      </div>

      <div class="shortcuts" id="shortcuts"></div>
    </section>
  </main>

  <footer class="ft">
    <span id="updated">—</span>
    <span id="pollNote"></span>
  </footer>

  <script src="panel.js" type="module"></script>
</body>
</html>
